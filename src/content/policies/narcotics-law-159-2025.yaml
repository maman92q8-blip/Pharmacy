title: "مرسوم بقانون رقم 159 لسنة 2025 في شأن مكافحة المخدرات والمؤثرات العقلية وتنظيم استعمالها والاتجار فيها"
title_en: "Decree-Law No. 159 of 2025 on combating narcotic drugs and psychotropic substances"
category: laws
year: 2025
number: "159/2025"
date: 2025-11-24
summary: "قانون موحد لمكافحة المخدرات والمؤثرات العقلية. نُشر في الجريدة الرسمية في 30 نوفمبر 2025 وسرى من 15 ديسمبر 2025، ويحل محل القانون رقم 74 لسنة 1983 والقانون رقم 48 لسنة 1987."
